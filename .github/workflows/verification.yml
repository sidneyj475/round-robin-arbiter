name: Arbiter Verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Verilator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make g++ autoconf \
            flex bison libfl2 libfl-dev \
            zlib1g-dev

      - name: Build and install Verilator 5.052
        run: |
          git clone --depth 1 --branch v5.052 \
            https://github.com/verilator/verilator.git \
            /tmp/verilator

          cd /tmp/verilator
          autoconf
          ./configure --prefix=/usr/local
          make -j2
          sudo make install

          verilator --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cocotb==2.1.0"

      - name: Run verification regression
        run: python run_tests.py
